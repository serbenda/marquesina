<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marquesina</title>
<meta name="description" content="Tus autobuses de Madrid en el mapa, en tiempo real: cuánto les falta y cuándo salir de casa. EMT, interurbanos, Alcobendas y Sanse.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/icono-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#d6402b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Marquesina">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: mapa arriba a pantalla completa, panel de llegadas tipo "marquesina" abajo (lateral en escritorio) */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --fg:#14202b; --muted:#5d6b78; --line:#dde3e9;
  --accent:#d6402b;       /* rojo marquesina */
  --stop:#14202b;
  --ok:#1f8a5b; --warn:#c77a0a; --now:#d6402b;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1419; --panel:#151d24; --fg:#e8eef3; --muted:#93a2af; --line:#26323c;
  --accent:#ff6a52; --stop:#e8eef3; --ok:#3fbf86; --warn:#e8a33a; --now:#ff6a52; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1419; --panel:#151d24; --fg:#e8eef3; --muted:#93a2af; --line:#26323c;
  --accent:#ff6a52; --stop:#e8eef3; --ok:#3fbf86; --warn:#e8a33a; --now:#ff6a52; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);display:flex;flex-direction:column}
#map{flex:1 1 55%;min-height:260px}
.leaflet-container{background:var(--bg);font:inherit}

.panel{flex:1 1 45%;min-height:0;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.bar h1{font:700 22px/1 var(--display);letter-spacing:.02em;margin:0;text-transform:uppercase}
.bar .mode{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:4px;background:var(--line);color:var(--muted)}
.bar .mode.live{background:var(--ok);color:#fff}
.spacer{flex:1}
.ring{width:30px;height:30px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font:600 10px var(--body);color:var(--muted);font-variant-numeric:tabular-nums}
button{font:600 13px var(--body);color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:6px;padding:7px 10px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.list{overflow-y:auto;padding:4px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.stophead{display:flex;align-items:center;gap:8px;margin:16px 0 2px}
.stophead .alias{font:700 19px/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase;color:var(--fg);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stophead .star{color:var(--warn);font-size:15px}
.stophead .edit{margin-left:auto;padding:4px 8px;font-size:12px}
.stopsub{font-size:12px;color:var(--muted);margin:0 0 4px}
.next{color:var(--muted);font-variant-numeric:tabular-nums}
.chip.go{color:var(--ok)} .chip.late{color:var(--muted)}
.hero{margin:12px 0 4px;padding:12px 14px;border-radius:10px;background:var(--fg);color:var(--panel);display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.hero .badge{min-width:46px;padding:7px 6px}
.hero .what{min-width:0;font-size:13px;line-height:1.3}
.hero .what b{display:block;font:700 18px/1.1 var(--display);letter-spacing:.02em;text-transform:uppercase}
.hero .when{text-align:right;font:700 30px/1 var(--display);font-variant-numeric:tabular-nums}
.hero .when small{display:block;font:600 11px var(--body);letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.hero.now{background:var(--now);color:#fff}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.badge{font:700 22px/1 var(--display);color:#fff;border-radius:6px;padding:7px 0;text-align:center}
.dest{min-width:0}
.dest b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dest small{color:var(--muted);font-variant-numeric:tabular-nums}
.eta{text-align:right}
.eta strong{display:block;font:700 26px/1 var(--display);font-variant-numeric:tabular-nums}
.chip{display:inline-block;margin-top:3px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.chip.now{color:var(--now)} .chip.near{color:var(--warn)} .chip.far{color:var(--ok)}
.empty,.err{color:var(--muted);padding:18px 0}
.err{color:var(--now)}
.note{margin:0;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);font-size:13px}

.bus-icon{display:grid;place-items:center;font:700 14px/1 var(--display);color:#fff;border:2px solid #fff;border-radius:7px;box-shadow:0 1px 4px rgba(0,0,0,.35);transition:transform .3s}
.stop-icon{width:18px;height:18px;border-radius:50%;background:var(--stop);border:4px solid var(--panel);box-shadow:0 0 0 2px var(--stop)}

dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg);padding:0;width:min(440px,calc(100% - 32px))}
dialog::backdrop{background:rgba(10,15,20,.5)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:12px}
.dlg h2{font:700 22px var(--display);text-transform:uppercase;margin:0}
.dlg p{margin:0;color:var(--muted);font-size:13px}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
input,select{font:15px var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

@media (min-width:900px){
  body{flex-direction:row}
  #map{flex:1 1 auto}
  .panel{flex:0 0 380px;border-top:0;border-left:1px solid var(--line);order:2}
}
@media (prefers-reduced-motion:reduce){.bus-icon{transition:none}}
</style>
</head>
<body>
<div id="map"></div>
<section class="panel">
  <div class="bar">
    <h1>Marquesina</h1>
    <span class="mode" id="mode">Demo</span>
    <span class="spacer"></span>
    <div class="ring" title="Próxima actualización">
      <svg width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="12" fill="none" stroke="var(--line)" stroke-width="3"/><circle id="ringFg" cx="15" cy="15" r="12" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="75.4" stroke-dashoffset="0"/></svg>
      <span id="ringTxt">60</span>
    </div>
    <button id="btnRefresh" aria-label="Actualizar ahora">↻</button>
    <button id="btnNear" title="Usar mi ubicación para cargar las paradas más cercanas">Cerca de mí</button>
    <button id="btnFind" aria-pressed="false" title="Toca el mapa para ver las paradas cercanas">Buscar paradas</button>
    <button id="btnInstall" hidden>Instalar</button>
    <button id="btnCfg">Ajustes</button>
  </div>
  <p class="err note" id="note" hidden></p>
  <div class="list" id="list"><p class="empty">Cargando…</p></div>
</section>

<dialog id="cfg">
  <form class="dlg" id="cfgForm" method="dialog">
    <h2>Ajustes</h2>
    <p>Todo funciona sin registro: añade los códigos de parada o usa Cerca de mí y Buscar paradas.</p>
    <label>Paradas EMT Madrid (números separados por comas)
      <input id="fStops" inputmode="numeric" placeholder="72, 3054"></label>
    <label>Paradas Consorcio: Alcobendas, Sanse, interurbanos (códigos de 5 cifras)
      <input id="fCrtm" inputmode="numeric" placeholder="06756, 06758"></label>
    <label>Proxy (déjalo vacío para usar el de marquesina)
      <input id="fProxy" placeholder="https://marquesina.serbenda.workers.dev"></label>
    <label>Actualizar cada
      <select id="fEvery"><option value="60">1 minuto</option><option value="120">2 minutos</option><option value="30">30 segundos</option></select></label>
    <div class="actions">
      <button type="button" id="btnDemo">Usar demo</button>
      <button type="submit" class="primary">Guardar</button>

</dialog>

<dialog id="stopDlg">
  <form class="dlg" id="stopForm" method="dialog">
    <h2 id="stopDlgTitle">Parada</h2>
    <p id="stopDlgSub"></p>
    <label>Nombre (por ejemplo Casa, Cole, Trabajo)
      <input id="fAlias" maxlength="24" autocomplete="off"></label>
    <label>Minutos andando hasta la parada
      <input id="fWalk" type="number" inputmode="numeric" min="0" max="60" placeholder="Sin indicar"></label>
    <label style="flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--fg)">
      <input id="fFav" type="checkbox" style="width:18px;height:18px"> Favorita (siempre arriba)</label>
    <div class="actions">
      <button type="button" id="btnRemoveStop">Quitar parada</button>
      <button type="submit" class="primary">Guardar</button>
    </div>
  </form>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ---------- Configuración ----------
// Proxy propio en Cloudflare: viene puesto para que nadie tenga que configurarlo
const PROXY = "https://marquesina.serbenda.workers.dev";
// Paradas de ejemplo en Alcobendas (Marqués de la Valdavia) para que la web arranque en vivo
// meta: datos propios de cada parada -> {"emt:69": {alias:"Casa", walk:5, fav:true}, "crtm:06756": {...}}
const DEF = {stops:"", crtm:"06756, 06758", proxy:PROXY, every:60, meta:{}};
const store = {
  get(){
    let v; try{ v = {...DEF, ...JSON.parse(localStorage.getItem("marquesina")||"{}")}; }catch{ v = {...DEF}; }
    if (!v.proxy) v.proxy = PROXY;   // ajustes antiguos guardados sin proxy
    delete v.email; delete v.pass; delete v.base;   // versiones anteriores guardaban una cuenta propia de EMT
    // Si no hay ninguna parada y no se eligió la demo a propósito, arrancar con las de ejemplo
    if (!v.crtm.trim() && !v.stops.trim() && !v.demo) v.crtm = DEF.crtm;
    if (!v.meta || typeof v.meta !== "object") v.meta = {};
    return v;
  },
  set(v){ try{ localStorage.setItem("marquesina", JSON.stringify(v)); }catch{} }
};
let cfg = store.get();
const hasEmt  = () => !!cfg.stops.trim();
const hasCrtm = () => !!(cfg.crtm.trim() && cfg.proxy);
const isLive  = () => !cfg.demo && (hasEmt() || hasCrtm());
const stopKey = s => `${s.crtm ? "crtm" : "emt"}:${s.id}`;
const metaOf  = s => cfg.meta[stopKey(s)] || {};
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// Colores por línea: estables según el número
const PALETTE = ["#2b6cb0","#c0392b","#1f8a5b","#8e44ad","#d35400","#16808a","#b7950b","#5d6d7e"];
const colorFor = l => PALETTE[[...String(l)].reduce((a,c)=>a+c.charCodeAt(0),0) % PALETTE.length];

// ---------- Mapa ----------
const map = L.map("map",{zoomControl:true}).setView([40.4168,-3.7038],15);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
const layerStops = L.layerGroup().addTo(map);
const busMarkers = new Map();   // clave bus -> {marker, trail, seen}
let fitted = false;

function busIcon(line){
  return L.divIcon({className:"", iconSize:[38,26], iconAnchor:[19,13],
    html:`<div class="bus-icon" style="width:38px;height:26px;background:${colorFor(line)}">${line}</div>`});
}
const stopIcon = L.divIcon({className:"", iconSize:[18,18], iconAnchor:[9,9], html:'<div class="stop-icon"></div>'});

// ---------- API EMT ----------
// El worker de marquesina inicia sesión en EMT con las claves de la aplicación
async function arrivals(stop){
  const j = await (await fetch(`${cfg.proxy.replace(/\/$/,"")}/emt/arrives/${stop}`)).json();
  if (j.code === "ERR") throw new Error(`EMT no está disponible ahora mismo (parada ${stop}).`);
  const d = j.data && j.data[0];
  if (!d) throw new Error(`La parada ${stop} no devolvió datos (${j.description||"sin respuesta"}).`);
  const si = (d.StopInfo||[])[0] || {};
  const sc = si.geometry && si.geometry.coordinates;
  return {
    id: stop,
    name: si.stopName || si.Description || `Parada ${stop}`,
    pos: sc ? [sc[1], sc[0]] : null,
    buses: (d.Arrive||[]).map(a=>({
      key:`${a.line}-${a.bus}`, line:a.line, dest:a.destination,
      eta:a.estimateArrive, dist:a.DistanceBus,
      pos: a.geometry && a.geometry.coordinates ? [a.geometry.coordinates[1], a.geometry.coordinates[0]] : null
    }))
  };
}

// ---------- API del Consorcio (CRTM): interurbanos y urbanos de Alcobendas, Sanse, etc. ----------
// Da tiempos de llegada en tiempo real por parada, pero no la posición de los autobuses.
// No admite llamadas directas desde otras webs (CORS), así que pasa por el proxy (worker.js).
const crtmUrl = (path) => `${cfg.proxy.replace(/\/$/,"")}/crtm/${path}`;
const asArray = v => v == null ? [] : Array.isArray(v) ? v : [v];
const crtmStopCache = new Map();
const crtmCode = c => c.includes("_") ? c : `8_${c.padStart(5,"0")}`;

async function crtmStopInfo(code){
  if (crtmStopCache.has(code)) return crtmStopCache.get(code);
  const j = await (await fetch(crtmUrl(`GetStops.php?codStop=${code}`))).json();
  const s = asArray(j.stops && j.stops.Stop)[0] || {};
  const info = {name: s.name || `Parada ${code}`, pos: s.coordinates ? [s.coordinates.latitude, s.coordinates.longitude] : null};
  crtmStopCache.set(code, info);
  return info;
}
// Recorridos de cada línea (para saber en qué itinerario y sentido está la parada). No cambian: se guardan.
const crtmLineCache = new Map();
async function crtmItineraries(codLine){
  if (crtmLineCache.has(codLine)) return crtmLineCache.get(codLine);
  const p = fetch(crtmUrl(`GetLinesInformation.php?activeItinerary=1&codLine=${encodeURIComponent(codLine)}`))
    .then(r=>r.json())
    .then(j=>{
      const info = asArray(j.lines && j.lines.LineInformation)[0] || {};
      return asArray(info.itinerary && info.itinerary.Itinerary).map(it=>({
        cod: it.codItinerary, dir: it.direction,
        stops: new Set(asArray(it.stops && it.stops.StopInformation).map(st=>st.codStop))
      }));
    })
    .catch(()=>{ crtmLineCache.delete(codLine); return []; });
  crtmLineCache.set(codLine, p);
  return p;
}

// Posición GPS real de los autobuses de cada línea que pasa por la parada (GetLineLocation)
async function crtmVehicles(code, times){
  const lines = new Map();
  for (const t of times) if (t.line && !lines.has(`${t.line.codLine}|${t.direction}`)) lines.set(`${t.line.codLine}|${t.direction}`, t);
  const found = await Promise.all([...lines.values()].map(async t=>{
    try{
      const its = await crtmItineraries(t.line.codLine);
      const it = its.find(i=>i.dir == t.direction && i.stops.has(code)) || its.find(i=>i.stops.has(code));
      if (!it) return [];
      const j = await (await fetch(crtmUrl(`GetLineLocation.php?mode=${t.line.codMode||8}&codItinerary=${encodeURIComponent(it.cod)}&codLine=${encodeURIComponent(t.line.codLine)}&codStop=${code}&direction=${it.dir}`))).json();
      return asArray(j.vehiclesLocation && j.vehiclesLocation.VehicleLocation)
        .filter(v=>v.coordinates && v.coordinates.latitude)
        .map(v=>({
          key:`v-${v.codVehicle || t.line.codLine + "-" + v.service}`,
          line: (v.line && v.line.shortDescription) || t.line.shortDescription,
          dest: (t.destination||"").replace(/^.*?-\s*/,"") || t.destination,
          pos:[v.coordinates.latitude, v.coordinates.longitude]
        }));
    }catch{ return []; }   // si falla la posición, siguen valiendo los tiempos
  }));
  return found.flat();
}

async function crtmArrivals(raw){
  const code = crtmCode(raw.trim());
  const [info, j] = await Promise.all([
    crtmStopInfo(code),
    fetch(crtmUrl(`GetStopsTimes.php?codStop=${code}&type=1&orderBy=2&stopTimesByIti=3`)).then(r=>r.json())
  ]);
  const st = j.stopTimes;
  if (!st) throw new Error(`La parada ${raw} del Consorcio no devolvió datos.`);
  const now = new Date(st.actualDate).getTime();
  const vehicles = await crtmVehicles(code, asArray(st.times && st.times.Time));
  return {
    id: code.replace(/^8_/,""), name: info.name, pos: info.pos, crtm: true, vehicles,
    buses: (()=>{
      const perLine = {};
      return asArray(st.times && st.times.Time).map((t,i)=>({
        key:`c-${code}-${t.line.shortDescription}-${i}`, line:t.line.shortDescription,
        dest:(t.destination||"").replace(/^.*?-\s*/,"") || t.destination,
        eta:Math.max(0, Math.round((new Date(t.time).getTime() - now)/1000)), dist:null, pos:null,
        // Los tiempos de horario llevan un código con el nombre de la línea; los del GPS, el del vehículo
        live: !(t.codIssue||"").startsWith(t.line.codLine)
      })).sort((a,b)=>a.eta-b.eta)
        .filter(b=> b.eta <= 90*60 && (perLine[b.line] = (perLine[b.line]||0) + 1) <= 2);
    })()
  };
}
async function crtmNearest(lat, lng){
  const j = await (await fetch(crtmUrl(`GetNearestStopsByLocation.php?latitude=${lat.toFixed(5)}&longitude=${lng.toFixed(5)}&mode=&method=1&precision=350`))).json();
  const seen = new Set();
  return asArray(j.stops && j.stops.Stop)
    .filter(s=>/^[68]_/.test(s.codStop) && !seen.has(s.codStop) && seen.add(s.codStop))
    .map(s=>({
      net: s.codStop.startsWith("6_") ? "emt" : "crtm",     // 6_ = EMT Madrid, 8_ = Consorcio
      code: s.codStop.startsWith("6_") ? s.codStop.slice(2) : s.shortCodStop,
      name:s.name, pos:[s.coordinates.latitude, s.coordinates.longitude],
      lines:asArray(s.lines && s.lines.Line).map(l=>l.shortDescription)
    }));
}

// ---------- Demo: buses simulados que se acercan a la parada ----------
const DEMO_STOP = {id:"72", name:"Demo · Cibeles", pos:[40.4193,-3.6932], demo:true};
const demoBuses = [
  {key:"27-1", line:"27", dest:"Plaza Castilla", from:[40.4085,-3.6925], eta:420},
  {key:"14-2", line:"14", dest:"Pío XII",        from:[40.4120,-3.7030], eta:260},
  {key:"146-3",line:"146",dest:"Callao",         from:[40.4265,-3.6880], eta:540},
  {key:"5-4",  line:"5",  dest:"Chamartín",      from:[40.4180,-3.7060], eta:120},
  {key:"150-5",line:"150",dest:"Virgen del Cortijo",from:[40.4300,-3.6950], eta:780},
];
const demoStart = Date.now();
function demoArrivals(){
  const t = (Date.now()-demoStart)/1000;
  const buses = demoBuses.map(b=>{
    let eta = b.eta - t; if (eta < 0) eta = ((eta % 900) + 900) % 900; // vuelve a empezar
    const f = Math.min(1, eta / b.eta);
    const pos = [DEMO_STOP.pos[0] + (b.from[0]-DEMO_STOP.pos[0])*f, DEMO_STOP.pos[1] + (b.from[1]-DEMO_STOP.pos[1])*f];
    const dist = Math.round(map.distance(pos, DEMO_STOP.pos));
    return {key:b.key, line:b.line, dest:b.dest, eta:Math.round(eta), dist, pos};
  });
  return [{...DEMO_STOP, buses}];
}

// ---------- Render ----------
let last = [];       // datos de la última consulta
let fetchedAt = 0;

function fmtEta(s){
  if (s >= 999999) return {txt:"+20", unit:"min"};
  if (s < 60) return {txt:"<1", unit:"min"};
  return {txt:String(Math.floor(s/60)), unit:"min"};
}
function status(s){ return s < 90 ? ["now","Llegando"] : s < 300 ? ["near","Cerca"] : ["far","En camino"]; }
function fmtDist(m){ return m == null ? "" : m >= 1000 ? (m/1000).toFixed(1).replace(".",",")+" km" : m+" m"; }

// Agrupa las llegadas de una parada por línea y destino: una fila por línea con sus próximos pasos
function groupByLine(buses, elapsed){
  const groups = new Map();
  for (const b of buses.slice().sort((x,y)=>x.eta-y.eta)){
    const eta = Math.max(0, b.eta - elapsed);
    const k = `${b.line}|${b.dest}`;
    if (!groups.has(k)) groups.set(k, {line:b.line, dest:b.dest, items:[]});
    groups.get(k).items.push({...b, eta});
  }
  return [...groups.values()];
}

// Cuándo salir: el primer bus al que da tiempo llegar andando
function leaveInfo(items, walkMin){
  if (!walkMin) return null;
  const walk = walkMin*60;
  const target = items.find(b => b.eta >= walk - 30);   // 30 s de margen
  if (!target) return {late:true};
  return {bus:target, leave: target.eta - walk, missedFirst: target !== items[0]};
}

function chipFor(g, walkMin){
  const first = g.items[0];
  const li = leaveInfo(g.items, walkMin);
  if (!li){ const [cls,lbl] = status(first.eta); return `<span class="chip ${cls}">${lbl}</span>`; }
  if (li.late) return `<span class="chip late">No llegas</span>`;
  if (li.leave <= 60) return `<span class="chip now">¡Sal ya!${li.missedFirst ? ` al de ${fmtEta(li.bus.eta).txt}′` : ""}</span>`;
  const which = li.missedFirst ? ` al de ${fmtEta(li.bus.eta).txt}′` : "";   // si el primero ya no da tiempo
  return `<span class="chip ${li.leave <= 180 ? "near" : "go"}">Sal en ${Math.floor(li.leave/60)} min${which}</span>`;
}

// Tarjeta principal: lo más urgente entre las paradas con minutos andando (favoritas primero)
function heroHtml(stops, elapsed){
  let best = null;
  for (const s of stops){
    if (s.error) continue;
    const m = metaOf(s); if (!m.walk) continue;
    for (const g of groupByLine(s.buses, elapsed)){
      const li = leaveInfo(g.items, m.walk);
      if (!li || li.late) continue;
      const score = (m.fav ? 0 : 1e6) + li.leave;
      if (!best || score < best.score) best = {score, s, g, li, m};
    }
  }
  if (!best) return "";
  const {s, g, li, m} = best;
  const now = li.leave <= 60;
  return `<div class="hero${now ? " now" : ""}">
    <div class="badge" style="background:${colorFor(g.line)}">${esc(g.line)}</div>
    <div class="what"><b>${esc(m.alias || s.name)}</b>${esc(g.dest)} · pasa en ${fmtEta(li.bus.eta).txt} min</div>
    <div class="when">${now ? "¡Ya!" : Math.floor(li.leave/60) + "′"}<small>${now ? "sal ahora" : "para salir"}</small></div>
  </div>`;
}

function renderList(){
  const el = document.getElementById("list");
  if (!last.length){ el.innerHTML = '<p class="empty">Añade una parada con Cerca de mí, Buscar paradas o Ajustes.</p>'; return; }
  const elapsed = (Date.now()-fetchedAt)/1000;
  // favoritas primero, el resto en el orden en que se añadieron
  const ordered = last.map((s,i)=>({s,i})).sort((a,b)=>((metaOf(b.s).fav?1:0)-(metaOf(a.s).fav?1:0)) || a.i-b.i).map(x=>x.s);
  el.innerHTML = (isLive() ? heroHtml(ordered, elapsed) : "") + ordered.map(s=>{
    if (s.error) return `<p class="err">${esc(s.error)}</p>`;
    const m = metaOf(s);
    const rows = groupByLine(s.buses, elapsed).map(g=>{
      const first = g.items[0], e = fmtEta(first.eta);
      const more = g.items.slice(1,3).map(b=>fmtEta(b.eta).txt + "′").join(" · ");
      const detail = s.crtm ? (first.live ? "En directo (GPS)" : "Según horario") : (fmtDist(first.dist) || "sin posición");
      return `<div class="row" data-key="${esc(first.key)}" data-line="${esc(g.line)}" data-stop="${esc(s.id)}">
        <div class="badge" style="background:${colorFor(g.line)}">${esc(g.line)}</div>
        <div class="dest"><b>${esc(g.dest)}</b><small>${detail}${more ? ` · <span class="next">luego ${more}</span>` : ""}</small></div>
        <div class="eta"><strong>${e.txt}<small style="font-size:13px"> ${e.unit}</small></strong>${chipFor(g, m.walk)}</div>
      </div>`;
    }).join("") || '<p class="empty">No hay autobuses previstos ahora mismo.</p>';
    const sub = [m.alias ? esc(s.name) : "", s.crtm ? `Consorcio ${esc(s.id)}` : `EMT ${esc(s.id)}`, m.walk ? `${m.walk} min andando` : ""].filter(Boolean).join(" · ");
    const editBtn = s.demo ? "" : `<button class="edit" data-edit="${esc(stopKey(s))}" data-name="${esc(s.name)}">Editar</button>`;
    return `<div class="stophead">${m.fav ? '<span class="star" aria-label="Favorita">★</span>' : ""}<span class="alias">${esc(m.alias || s.name)}</span>${editBtn}</div>
      <p class="stopsub">${sub}</p>${rows}`;
  }).join("") + (isLive() ? "" : '<p class="empty">Esto es una demo. Pulsa <b>Cerca de mí</b> o <b>Buscar paradas</b> para ver los autobuses reales de tu parada.</p>');
}

function renderMap(){
  layerStops.clearLayers();
  const seen = new Set(), bounds = [];
  for (const s of last){
    if (s.error) continue;
    if (s.pos){
      const mk = L.marker(s.pos,{icon:stopIcon}).addTo(layerStops); bounds.push(s.pos);
      if (s.crtm){
        // El Consorcio no da posiciones: mostramos las próximas llegadas junto a la parada
        const next = s.buses.slice().sort((a,b)=>a.eta-b.eta).slice(0,3)
          .map(b=>`<b style="color:${colorFor(b.line)}">${b.line}</b> ${fmtEta(b.eta).txt}′`).join(" · ");
        mk.bindTooltip(next || esc(metaOf(s).alias || s.name),{permanent:true,direction:"top",offset:[0,-10]});
        mk.bindPopup(`<b>${s.name}</b><br>Parada ${s.id}`);
      } else mk.bindTooltip(s.name);
    }
    for (const b of [...s.buses, ...(s.vehicles||[])]){
      if (!b.pos || seen.has(b.key)) continue;
      seen.add(b.key); bounds.push(b.pos);
      let m = busMarkers.get(b.key);
      if (!m){
        const marker = L.marker(b.pos,{icon:busIcon(b.line)}).addTo(map);
        const trail = L.polyline([b.pos],{color:colorFor(b.line),weight:3,opacity:.55,dashArray:"4 6"}).addTo(map);
        m = {marker, trail}; busMarkers.set(b.key, m);
      } else {
        m.marker.setLatLng(b.pos);
        m.trail.addLatLng(b.pos);
      }
      m.marker.bindPopup(b.eta == null
        ? `<b>Línea ${esc(b.line)}</b> → ${esc(b.dest)}<br>Posición GPS del Consorcio`
        : `<b>Línea ${esc(b.line)}</b> → ${esc(b.dest)}<br>${fmtDist(b.dist)} · ${fmtEta(b.eta).txt} min`);
    }
  }
  for (const [k,m] of busMarkers) if (!seen.has(k)){ map.removeLayer(m.marker); map.removeLayer(m.trail); busMarkers.delete(k); }
  if (!fitted && bounds.length){ map.fitBounds(bounds,{padding:[40,40],maxZoom:16}); fitted = true; }
}

document.getElementById("list").addEventListener("click", e=>{
  const row = e.target.closest(".row"); if (!row) return;
  let m = busMarkers.get(row.dataset.key);
  if (!m && row.dataset.line){
    // Consorcio: los tiempos no dicen qué vehículo es; se elige el de esa línea más cercano a la parada
    const s = last.find(x=>x.crtm && x.id === row.dataset.stop);
    const v = s && (s.vehicles||[]).filter(v=>v.line === row.dataset.line)
      .sort((a,b)=>map.distance(a.pos,s.pos)-map.distance(b.pos,s.pos))[0];
    m = v && busMarkers.get(v.key);
  }
  if (m){ map.setView(m.marker.getLatLng(), 16); m.marker.openPopup(); }
});

// ---------- Ciclo de actualización ----------
let nextAt = 0;
async function refresh(){
  const stops = cfg.stops.split(/[,\s]+/).filter(Boolean);
  document.getElementById("mode").textContent = isLive() ? "En vivo" : "Demo";
  document.getElementById("mode").classList.toggle("live", isLive());
  if (!isLive()){ last = demoArrivals(); }
  else {
    const jobs = [];
    if (hasEmt()) jobs.push(...stops.map(s=>arrivals(s).catch(err=>({id:s, error:
      err instanceof TypeError ? `No se pudo conectar con EMT (parada ${s}).` : err.message}))));
    if (hasCrtm()) jobs.push(...cfg.crtm.split(/[,\s]+/).filter(Boolean).map(s=>crtmArrivals(s).catch(err=>({id:s, error:
      err instanceof TypeError ? `No se pudo conectar con el Consorcio a través del proxy (parada ${s}). Revisa la URL del proxy en Ajustes.` : err.message}))));
    last = await Promise.all(jobs);
  }
  fetchedAt = Date.now();
  nextAt = fetchedAt + cfg.every*1000;
  renderMap(); renderList();
}
function tick(){
  const left = Math.max(0, (nextAt-Date.now())/1000);
  document.getElementById("ringTxt").textContent = Math.ceil(left);
  document.getElementById("ringFg").setAttribute("stroke-dashoffset", 75.4*(1-left/cfg.every));
  if (left <= 0) refresh();
  if (fetchedAt) renderList(); // cuenta atrás de minutos entre consultas
  // en demo, mover los buses suavemente cada segundo
  if (!isLive() && fetchedAt){ last = demoArrivals(); fetchedAt = Date.now(); renderMap(); }
}
setInterval(tick, 1000);
document.getElementById("btnRefresh").onclick = refresh;

// ---------- Ajustes ----------
const dlg = document.getElementById("cfg");
document.getElementById("btnCfg").onclick = ()=>{
  fStops.value = cfg.stops;
  fCrtm.value = cfg.crtm; fProxy.value = cfg.proxy === PROXY ? "" : cfg.proxy;
  fEvery.value = String(cfg.every); dlg.showModal();
};
document.getElementById("cfgForm").addEventListener("submit", ()=>{
  cfg = {stops:fStops.value.trim(),
         demo:false, crtm:fCrtm.value.trim(), proxy:(fProxy.value.trim() || PROXY).replace(/\/$/,""),
         every:+fEvery.value};
  store.set(cfg); fitted = false; refresh();
});
document.getElementById("btnDemo").onclick = ()=>{
  cfg = {...cfg, demo:true}; store.set(cfg); fitted = false; dlg.close(); refresh();
};

// ---------- Editar una parada: nombre, minutos andando, favorita, quitar ----------
const stopDlg = document.getElementById("stopDlg");
let editing = null;
document.getElementById("list").addEventListener("click", e=>{
  const b = e.target.closest("[data-edit]"); if (!b) return;
  e.stopPropagation();
  editing = b.dataset.edit;
  const m = cfg.meta[editing] || {};
  const [net, id] = editing.split(":");
  document.getElementById("stopDlgTitle").textContent = m.alias || b.dataset.name;
  document.getElementById("stopDlgSub").textContent = `${b.dataset.name} · ${net === "emt" ? "EMT Madrid" : "Consorcio"} ${id}`;
  fAlias.value = m.alias || ""; fWalk.value = m.walk || ""; fFav.checked = !!m.fav;
  stopDlg.showModal();
});
document.getElementById("stopForm").addEventListener("submit", ()=>{
  if (!editing) return;
  const walk = Math.max(0, Math.min(60, parseInt(fWalk.value,10) || 0));
  const m = {alias: fAlias.value.trim(), walk, fav: fFav.checked};
  const meta = {...cfg.meta};
  if (m.alias || m.walk || m.fav) meta[editing] = m; else delete meta[editing];
  cfg = {...cfg, meta}; store.set(cfg); renderList();
});
document.getElementById("btnRemoveStop").onclick = ()=>{
  if (!editing) return;
  const [net, id] = editing.split(":");
  const field = net === "emt" ? "stops" : "crtm";
  const list = cfg[field].split(/[,\s]+/).filter(x => x && x !== id && x.padStart(5,"0") !== id);
  const meta = {...cfg.meta}; delete meta[editing];
  cfg = {...cfg, [field]: list.join(", "), meta}; store.set(cfg);
  stopDlg.close(); fitted = false; refresh();
};

// ---------- Buscar paradas del Consorcio tocando el mapa ----------
const layerFind = L.layerGroup().addTo(map);
const btnFind = document.getElementById("btnFind");
let finding = false;
function setFinding(on){
  finding = on; btnFind.setAttribute("aria-pressed", on);
  btnFind.classList.toggle("primary", on);
  btnFind.textContent = on ? "Toca el mapa" : "Buscar paradas";
  if (!on) layerFind.clearLayers();
}
btnFind.onclick = ()=>{
  if (!finding) map.setView([40.545,-3.635], 15);   // Alcobendas / Sanse
  setFinding(!finding);
};
map.on("click", async e=>{
  if (!finding) return;
  layerFind.clearLayers();
  try{
    const found = await crtmNearest(e.latlng.lat, e.latlng.lng);
    if (!found.length){ showNote("No hay paradas de autobús cerca de ese punto."); return; }
    for (const s of found){
      const added = (s.net==="emt" ? cfg.stops : cfg.crtm).split(/[,\s]+/).includes(s.code);
      L.circleMarker(s.pos,{radius:8,color:"#fff",weight:2,fillColor:colorFor(s.code),fillOpacity:1})
        .bindPopup(`<b>${s.name}</b><br>${s.net==="emt"?"EMT Madrid":"Consorcio"} · parada ${s.code}<br>Líneas: ${s.lines.join(", ")}<br>
          <button data-add="${s.code}" data-net="${s.net}" style="margin-top:6px"${added?" disabled":""}>${added?"Ya añadida":"Añadir a mis paradas"}</button>`)
        .addTo(layerFind);
    }
  }catch(err){ showNote("No se pudo consultar el Consorcio. Revisa la URL del proxy en Ajustes."); }
});
document.addEventListener("click", e=>{
  const code = e.target.dataset && e.target.dataset.add; if (!code) return;
  const field = e.target.dataset.net === "emt" ? "stops" : "crtm";
  const list = cfg[field].split(/[,\s]+/).filter(Boolean);
  if (!list.includes(code)) list.push(code);
  cfg = {...cfg, demo:false, [field]:list.join(", ")}; store.set(cfg);
  e.target.textContent = "Añadida"; e.target.disabled = true;
  refresh();
});
// ---------- Cerca de mí: paradas más cercanas a la ubicación del usuario ----------
document.getElementById("btnNear").onclick = ()=>{
  if (!navigator.geolocation){ showNote("Este navegador no permite usar la ubicación."); return; }
  showNote("Buscando tu ubicación…");
  navigator.geolocation.getCurrentPosition(async p=>{
    try{
      const {latitude:lat, longitude:lng} = p.coords;
      const found = (await crtmNearest(lat, lng))
        .sort((a,b)=>map.distance([lat,lng],a.pos)-map.distance([lat,lng],b.pos)).slice(0,3);
      if (!found.length){ showNote("No hay paradas de autobús cerca de ti."); return; }
      const pick = net => found.filter(s=>s.net===net).map(s=>s.code).join(", ");
      cfg = {...cfg, demo:false, stops:pick("emt"), crtm:pick("crtm")}; store.set(cfg);
      fitted = false; showNote(`Cargadas ${found.length} paradas cerca de ti.`); refresh();
    }catch{ showNote("No se pudo consultar el Consorcio. Inténtalo de nuevo en un momento."); }
  }, ()=> showNote("No se pudo obtener tu ubicación. Revisa el permiso de ubicación del navegador."),
  {enableHighAccuracy:true, timeout:10000});
};

// Al volver a la pestaña o abrir la app instalada, actualizar enseguida
document.addEventListener("visibilitychange", ()=>{
  if (document.visibilityState === "visible" && Date.now() - fetchedAt > 15000) refresh();
});

// ---------- App instalable (PWA) ----------
if ("serviceWorker" in navigator) {
  window.addEventListener("load", ()=> navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
// Android y escritorio: botón Instalar cuando el navegador lo permite
let installPrompt = null;
const btnInstall = document.getElementById("btnInstall");
window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); installPrompt = e; btnInstall.hidden = false; });
btnInstall.onclick = async ()=>{
  if (!installPrompt) return;
  installPrompt.prompt(); await installPrompt.userChoice; installPrompt = null; btnInstall.hidden = true;
};
window.addEventListener("appinstalled", ()=>{ btnInstall.hidden = true; showNote("Marquesina instalada. Ya la tienes en tu pantalla de inicio."); });
// iPhone: Safari no tiene botón de instalar; se explica una vez
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
if (isIOS && !standalone) {
  try {
    if (!localStorage.getItem("marquesina-ios-tip")) {
      localStorage.setItem("marquesina-ios-tip", "1");
      setTimeout(()=> showNote("Para instalarla: pulsa Compartir y luego «Añadir a pantalla de inicio»."), 3000);
    }
  } catch {}
}

let noteTimer;
function showNote(msg){
  const p = document.getElementById("note");
  p.textContent = msg; p.hidden = false;
  clearTimeout(noteTimer); noteTimer = setTimeout(()=>{ p.hidden = true; }, 6000);
}

refresh();
</script>
</body>
