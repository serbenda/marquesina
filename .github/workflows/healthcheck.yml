name: Chequeo de marquesina

# Cada hora comprueba que la web, el Consorcio y EMT responden a través del worker.
# Si algo falla, el workflow sale en rojo y GitHub avisa por email al dueño del repo
# (Settings > Notifications > Actions: "Send notifications for failed workflows only").

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Web publicada
        run: |
          curl -fsS --retry 2 --retry-delay 10 "https://bendi.dev/marquesina/" | grep -q "<title>Marquesina</title>"
          echo "OK web"

      - name: Consorcio a través del worker
        run: |
          body=$(curl -fsS --retry 2 --retry-delay 10 "https://api.bendi.dev/crtm/GetStopsTimes.php?codStop=8_06756&type=1&orderBy=2&stopTimesByIti=3")
          echo "$body" | grep -q '"stopTimes"' || { echo "Respuesta inesperada del Consorcio:"; echo "$body" | head -c 400; exit 1; }
          echo "OK Consorcio"

      - name: EMT a través del worker
        run: |
          body=$(curl -sS --retry 2 --retry-delay 10 "https://api.bendi.dev/emt/arrives/69")
          echo "$body" | grep -q '"code":"00"' || { echo "EMT no responde bien:"; echo "$body" | head -c 400; exit 1; }
          echo "OK EMT"

      - name: Avisos (clave VAPID del worker)
        run: |
          body=$(curl -fsS --retry 2 --retry-delay 10 "https://api.bendi.dev/push/key")
          echo "$body" | grep -q '"publicKey"' || { echo "El worker no devuelve la clave de los avisos:"; echo "$body" | head -c 400; exit 1; }
          echo "OK avisos"

      - name: Dirección alternativa (workers.dev)
        run: |
          curl -fsS --retry 2 --retry-delay 10 "https://marquesina.serbenda.workers.dev/push/key" | grep -q '"publicKey"'
          echo "OK workers.dev"

      - name: Repetidor de respaldo (Deno Deploy)
        # Fuera de Cloudflare, para los bloqueos de LaLiga (docs/RESPALDO.md). Comprueba que llega al worker.
        run: |
          curl -fsS --retry 2 --retry-delay 10 "https://marquesina.serbenda.deno.net/push/key" | grep -q '"publicKey"'
          echo "OK repetidor"

      - name: Búsqueda de paradas a través del repetidor
        # Prueba real por Deno Deploy (no simulada): Deno rechaza las rutas que acaban en ".php",
        # así que la web y este chequeo piden la búsqueda sin ".php" (ver docs/OPERACIONES.md, INC-6).
        run: |
          body=$(curl -fsS --retry 2 --retry-delay 10 "https://marquesina.serbenda.deno.net/crtm/GetNearestStopsByLocation?latitude=40.54&longitude=-3.64&mode=&method=1&precision=500")
          echo "$body" | grep -q '"stops"' || { echo "La búsqueda por el repetidor no devuelve paradas:"; echo "$body" | head -c 400; exit 1; }
          echo "OK búsqueda por el repetidor"
